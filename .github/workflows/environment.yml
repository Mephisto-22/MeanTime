name: Environment

on:
  # The up/down button (#65).
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: Bring it up or tear it down
        type: choice
        options: [up, down]
        required: true

  # Nightly teardown (#66) of Dev and Prod. The database's data is kept in the
  # base layer. 07:00 UTC is 1 a.m. CST.
  schedule:
    - cron: '0 7 * * *'

  # Image builds (#64): a push to dev builds Dev's images, a push to main Prod's.
  push:
    branches: [dev, main]
    paths: ['backend/**', 'frontend/**']

permissions:
  id-token: write # GitHub's sign-in to AWS (OIDC)
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Button: the chosen environment. Nightly: both. Push: dev or prod, by branch.
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev", "prod"]') || fromJSON(format('["{0}"]', inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev'))) }}

    # One run per environment at a time, so an apply and a destroy never overlap.
    concurrency:
      group: environment-${{ matrix.environment }}
      cancel-in-progress: false

    env:
      ENVIRONMENT: ${{ matrix.environment }}
      # Button: up or down. Nightly: down. Push: images.
      ACTION: ${{ inputs.action || (github.event_name == 'schedule' && 'down' || 'images') }}
      BRANCH: ${{ github.ref_name }}
      PROFILE: meantime-${{ matrix.environment }}
      ROLE_ARN: ${{ matrix.environment == 'prod' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
      AWS_REGION: us-east-2

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}/app

    steps:
      - name: Check the branch and settings
        working-directory: .
        run: |
          if [ "$ENVIRONMENT" = prod ] && [ "$BRANCH" != main ]; then
            echo "::error::Prod can only be changed from main (this run is on $BRANCH)."
            exit 1
          fi
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Set the AWS_DEV_ROLE_ARN and AWS_PROD_ROLE_ARN repository variables (see the Infrastructure Guide)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: meantime-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # backend.hcl and the providers expect the meantime-dev / meantime-prod
      # profiles that developers use locally, so Terraform runs unchanged.
      - name: Save the credentials as the profile Terraform expects
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$PROFILE"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$PROFILE"
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$PROFILE"
          aws configure set region "$AWS_REGION" --profile "$PROFILE"
          aws sts get-caller-identity --profile "$PROFILE" --query Arn --output text

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config=../backend.hcl

      - name: terraform apply
        if: env.ACTION == 'up'
        run: terraform apply -input=false -auto-approve

      # Only the images: builds and pushes any whose tag isn't in ECR yet,
      # without bringing the environment up.
      - name: Build and push images
        if: env.ACTION == 'images'
        run: >-
          terraform apply -input=false -auto-approve
          -target=module.app.terraform_data.backend_image
          -target=module.app.terraform_data.frontend_image

      # Does nothing when the environment is already down.
      - name: terraform destroy
        if: env.ACTION == 'down'
        run: terraform destroy -input=false -auto-approve

      - name: Summary
        run: |
          {
            if [ "$ACTION" = images ]; then
              echo "## MeanTime $ENVIRONMENT images are in ECR"
              echo "The next \`up\` uses them instead of building its own."
            elif [ "$ACTION" = down ]; then
              echo "## MeanTime $ENVIRONMENT is down"
              echo "The app layer was destroyed. The database's data and the images are kept, and come back with the next \`up\`."
            elif [ "$ENVIRONMENT" = prod ]; then
              echo "## MeanTime prod is up"
              echo "Open: $(terraform output -raw app_url)"
              echo
              echo "Tear it down with this workflow (action: down) when you're done. It's also torn down every night."
            else
              echo "## MeanTime dev is up"
              echo "Dev has no public address. Open a tunnel, then go to http://localhost:3000."
              echo
              echo "PowerShell:"
              echo '```powershell'
              terraform output -raw dev_tunnel_command_powershell
              echo
              echo '```'
              echo "Git Bash, macOS, Linux:"
              echo '```bash'
              terraform output -raw dev_tunnel_command
              echo
              echo '```'
              echo "Tear it down with this workflow (action: down) when you're done. It's also torn down every night."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
