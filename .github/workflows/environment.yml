name: Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, prod]
        required: true
      action:
        description: Bring it up or tear it down
        type: choice
        options: [up, down]
        required: true

permissions:
  id-token: write # GitHub's sign-in to AWS (OIDC)
  contents: read

# One run per environment at a time, so an apply and a destroy never overlap.
concurrency:
  group: environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      BRANCH: ${{ github.ref_name }}
      PROFILE: meantime-${{ inputs.environment }}
      ROLE_ARN: ${{ inputs.environment == 'prod' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
      AWS_REGION: us-east-2

    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}/app

    steps:
      - name: Check the branch and settings
        working-directory: .
        run: |
          if [ "$ENVIRONMENT" = prod ] && [ "$BRANCH" != main ]; then
            echo "::error::Prod can only be changed from main (this run is on $BRANCH)."
            exit 1
          fi
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Set the AWS_DEV_ROLE_ARN and AWS_PROD_ROLE_ARN repository variables (see the Infrastructure Guide)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: meantime-${{ inputs.environment }}-${{ inputs.action }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # backend.hcl and the providers expect the meantime-dev / meantime-prod
      # profiles that developers use locally, so Terraform runs unchanged.
      - name: Save the credentials as the profile Terraform expects
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$PROFILE"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$PROFILE"
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$PROFILE"
          aws configure set region "$AWS_REGION" --profile "$PROFILE"
          aws sts get-caller-identity --profile "$PROFILE" --query Arn --output text

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -backend-config=../backend.hcl

      - name: terraform apply
        if: inputs.action == 'up'
        run: terraform apply -input=false -auto-approve

      - name: terraform destroy
        if: inputs.action == 'down'
        run: terraform destroy -input=false -auto-approve

      - name: Summary
        run: |
          {
            if [ "$ACTION" = down ]; then
              echo "## MeanTime $ENVIRONMENT is down"
              echo "Everything in the app layer was destroyed. Images stay in ECR."
            elif [ "$ENVIRONMENT" = prod ]; then
              echo "## MeanTime prod is up"
              echo "Open: $(terraform output -raw app_url)"
              echo
              echo "Tear it down with this workflow (action: down) when you're done."
            else
              echo "## MeanTime dev is up"
              echo "Dev has no public address. Open a tunnel, then go to http://localhost:3000."
              echo
              echo "PowerShell:"
              echo '```powershell'
              terraform output -raw dev_tunnel_command_powershell
              echo
              echo '```'
              echo "Git Bash, macOS, Linux:"
              echo '```bash'
              terraform output -raw dev_tunnel_command
              echo
              echo '```'
              echo "Tear it down with this workflow (action: down) when you're done."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
