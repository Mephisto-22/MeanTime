# Tests for every pull request and every push to dev or main. All three jobs
# run in the Docker Compose containers, the same way developers run them.
# - Backend and frontend unit tests (#62). Branch protection on dev and main
#   requires them to pass before a PR can be merged.
# - Integration smoke check (#63): starts the whole stack and checks it
#   (frontend proxy -> backend -> database) with a few API calls.

name: Tests

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      # Starts the database first; Django creates and drops a test database.
      - name: python manage.py test
        run: docker compose run --rm backend python manage.py test

      - name: Stop the database
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      # The first run installs the dependencies (the container's entrypoint
      # does that); the later ones reuse them.
      - name: pnpm typecheck
        run: docker compose run --rm --no-deps frontend pnpm typecheck

      - name: pnpm test
        run: docker compose run --rm --no-deps frontend pnpm test

      - name: pnpm build
        run: docker compose run --rm --no-deps frontend pnpm build

      - name: pnpm test:smoke
        run: docker compose run --rm --no-deps frontend pnpm test:smoke

  smoke:
    name: Smoke check against the running app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start the app
        run: docker compose up -d --build

      - name: Wait for the app to answer through the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 5
          done
          echo "The app did not come up within 5 minutes."
          exit 1

      - name: Smoke check
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          api="$BASE_URL/api"
          email="smoke-${GITHUB_RUN_ID:-local}-$(date +%s)@example.com"
          password='Smoke-check-pass-123!'
          json='Content-Type: application/json'

          echo "1. Health check reports the database connected"
          curl -fsS "$api/health" | jq -e '.database == "connected"'

          echo "2. Register a new user"
          curl -fsS -X POST "$api/auth/register" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"display_name\":\"Smoke Check\"}" \
            | jq -e --arg e "$email" '.email == $e'

          echo "3. Log in"
          token=$(curl -fsS -X POST "$api/auth/login" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" | jq -er '.access_token')

          echo "4. Fetch the logged-in user"
          curl -fsS "$api/auth/me" -H "Authorization: Bearer $token" \
            | jq -e --arg e "$email" '.email == $e'

          echo "5. Create a board; it starts with the default columns"
          curl -fsS -X POST "$api/kanban/boards" -H "$json" -H "Authorization: Bearer $token" \
            -d '{"title":"Smoke check board","description":""}' \
            | jq -e '[.columns[].title] == ["To Do", "In Progress", "Done"]'

          echo "6. The board shows up in the user's list"
          curl -fsS "$api/kanban/boards" -H "Authorization: Bearer $token" \
            | jq -e 'map(.title) | index("Smoke check board") != null'

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the app
        if: always()
        run: docker compose down -v
