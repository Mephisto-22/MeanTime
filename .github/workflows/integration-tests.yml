# Integration smoke check (#63): starts the normal Docker Compose stack and
# checks the whole app (frontend proxy -> backend -> database) with a few
# API calls. Deeper API + database tests run with Django's test runner.

name: Integration tests

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke check against the running app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start the app
        run: docker compose up -d --build

      - name: Wait for the app to answer through the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 5
          done
          echo "The app did not come up within 5 minutes."
          exit 1

      - name: Smoke check
        env:
          BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail
          api="$BASE_URL/api"
          email="smoke-${GITHUB_RUN_ID:-local}-$(date +%s)@example.com"
          password='Smoke-check-pass-123!'
          json='Content-Type: application/json'

          echo "1. Health check reports the database connected"
          curl -fsS "$api/health" | jq -e '.database == "connected"'

          echo "2. Register a new user"
          curl -fsS -X POST "$api/auth/register" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"display_name\":\"Smoke Check\"}" \
            | jq -e --arg e "$email" '.email == $e'

          echo "3. Log in"
          token=$(curl -fsS -X POST "$api/auth/login" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" | jq -er '.access_token')

          echo "4. Fetch the logged-in user"
          curl -fsS "$api/auth/me" -H "Authorization: Bearer $token" \
            | jq -e --arg e "$email" '.email == $e'

          echo "5. Create a board; it starts with the default columns"
          curl -fsS -X POST "$api/kanban/boards" -H "$json" -H "Authorization: Bearer $token" \
            -d '{"title":"Smoke check board","description":""}' \
            | jq -e '[.columns[].title] == ["To Do", "In Progress", "Done"]'

          echo "6. The board shows up in the user's list"
          curl -fsS "$api/kanban/boards" -H "Authorization: Bearer $token" \
            | jq -e 'map(.title) | index("Smoke check board") != null'

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the app
        if: always()
        run: docker compose down -v
